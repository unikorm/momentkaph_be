name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:

  build:
    name: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      nginx_hash: ${{ steps.nginx_hash.outputs.value }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: npm ci
      - run: npm run ci        # typecheck + build -> dist/

      - name: Read version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Hash nginx configs
        id: nginx_hash
        run: echo "value=$(cat nginx/*.conf | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Package app
        run: tar -czf BE.tar.gz -C dist .

      - name: Package nginx
        run: |
              tar -czf nginx.tar.gz -C nginx .
              echo "${{ steps.nginx_hash.outputs.value }}" > nginx.hash

      - name: Summary
        run: |
          {
            echo "## Build summary"
            echo "- Version: \`${{ steps.version.outputs.value }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- PR: #${{ github.event.pull_request.number }} — ${{ github.event.pull_request.title }}"
            echo "- App size: \`$(du -h BE.tar.gz | cut -f1)\`"
            echo "- nginx hash: \`${{ steps.nginx_hash.outputs.value }}\`"
            echo ""
            echo "### App contents"
            echo '```'
            tar -tzf BE.tar.gz | head -100
            echo '```'
            echo ""
            echo "### nginx contents"
            echo '```'
            tar -tzf nginx.tar.gz | head -100
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            BE.tar.gz
            nginx.tar.gz
            nginx.hash
            scripts/deploy.sh

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-assets

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: v${{ needs.build.outputs.version }}
          files: |
            BE.tar.gz
            nginx.tar.gz
            nginx.hash
            scripts/deploy.sh

  deploy:
    name: deploy
    needs: [build, release]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-assets

      - name: Setup SSH
        run: |
            mkdir -p ~/.ssh
            echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            echo "${{ secrets.KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Ship artifacts
        run: |
            scp -i ~/.ssh/deploy_key \
              BE.tar.gz nginx.tar.gz nginx.hash scripts/deploy.sh \
              "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}:/tmp/"

      - name: Deploy
        run: |
            ssh -i ~/.ssh/deploy_key \
              "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
              'chmod +x /tmp/deploy.sh && bash /tmp/deploy.sh'

