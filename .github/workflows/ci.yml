name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

jobs:
  on-merge:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - run: echo "PR #${{ github.event.pull_request.number }} merged into main"

  build:
    name: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      nginx_hash: ${{ steps.nginx_hash.outputs.value }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & build
        run: npm run ci

      - name: Read version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Hash nginx configs
        id: nginx_hash
        run: echo "value=$(cat nginx/nginx.conf.sh nginx/nestjs-api.sh | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  release:
    name: create release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          files: |
            nginx/nginx.conf.sh
            nginx/nestjs-api.sh
          body: |
            Merged PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}
            nginx config hash: `${{ needs.build.outputs.nginx_hash }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
