name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

jobs:
  on-merge:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - run: echo "PR ${{ github.event.pull_request.number }} merged into main"

  build:
    name: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      nginx_hash: ${{ steps.nginx_hash.outputs.value }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run ci        # typecheck + build -> dist/

      - name: Read version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Hash nginx configs
        id: nginx_hash
        run: echo "value=$(cat nginx/nginx.conf.sh nginx/nestjs-api.sh | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Package app
        run: tar -czf BE.tar.gz -C dist .

      - name: Package nginx
        run: |
          tar -czf nginx.tar.gz -C nginx nginx.conf.sh nestjs-api.sh
          echo "${{ steps.nginx_hash.outputs.value }}" > nginx.hash

      - name: Summary
        run: |
          {
            echo "## Build summary"
            echo "- Version: \`${{ steps.version.outputs.value }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- PR: #${{ github.event.pull_request.number }} — ${{ github.event.pull_request.title }}"
            echo "- App size: \`$(du -h BE.tar.gz | cut -f1)\`"
            echo "- nginx hash: \`${{ steps.nginx_hash.outputs.value }}\`"
            echo ""
            echo "### App contents"
            echo '```'
            tar -tzf BE.tar.gz | head -100
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            BE.tar.gz
            nginx.tar.gz
            nginx.hash

  release:
    name: create release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      - uses: actions/download-artifact@v7
        with:
          name: release-assets

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          files: |
            BE.tar.gz
            nginx.tar.gz
            nginx.hash
