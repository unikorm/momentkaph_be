name: CI

on:
  workflow_dispatch:

jobs:
  # ── 1. Typecheck & build the exact commit that landed on main ──
  ci:
    name: Typecheck & build
    runs-on: ubuntu-latest
    outputs:
      nginx_hash: ${{ steps.nginx_hash.outputs.value }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}  # the merge commit on main
          fetch-depth: 0   # full history + tags, needed for the version check below

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Typecheck & build
        run: npm run ci   # tsc --noEmit && tsc

      - name: Hash nginx configs
        id: nginx_hash
        run: echo "value=$(cat nginx/nginx.conf.sh nginx/nestjs-api.sh | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  # ── 2. GitHub release ──
  release:
    name: Create release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.ci.outputs.version }}
          name: v${{ needs.ci.outputs.version }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          files: |
            nginx/nginx.conf.sh
            nginx/nestjs-api.sh
          body: |
            Merged PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}
            nginx config hash: `${{ needs.ci.outputs.nginx_hash }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
