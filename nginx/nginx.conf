# ============================================================
# NGINX MAIN CONFIGURATION — MOMENTKAPH API
# ============================================================
#
# ROLE
# ----
# Public entry point for the photography portfolio backend.
# Terminates TLS, rate-limits, caches gallery responses, and
# reverse-proxies to a Node backend on 127.0.0.1:4869.
#
# Nothing else runs here. No static files, no load balancing.
# Its single job is to be a hardened boundary between the
# internet and the Node process.
#
# NETWORK TOPOLOGY
# ----------------
#   [ Internet ]
#         |
#         v
#   [ this nginx, :443 ]   <-- TLS, rate limit, cache, sanitize
#         |
#         v
#   [ Node BE, :4869 ]     <-- JSON: contact form + image links
#
# FILE LAYOUT
# -----------
# /etc/nginx/
#   nginx.conf                    <-- you are here.
#                                     Global only: workers,
#                                     logging, gzip, zones,
#                                     cache path, maps.
#
#   conf.d/apis.conf <-- TLS, upstream, routing
#
#   snippets/security-headers.conf <-- authoritative response
#                                      headers.
#   snippets/proxy-sanitize.conf   <-- strips upstream headers.
#
# Before reloading: always run `nginx -t`. Config is spread over
# several files and a typo anywhere fails the whole reload.
#
# OPERATIONAL POINTERS
# --------------------
# Test config:      nginx -t
# Reload (no drop): sudo systemctl reload nginx
# Access log:       /var/log/nginx/access.log   (format: edge)
# Error log:        /var/log/nginx/error.log    (level: warn)
# Cache dir:        /var/cache/nginx
# Purge cache:      sudo rm -rf /var/cache/nginx/* && sudo systemctl reload nginx
# Banned IPs:       sudo fail2ban-client status momentkaph-scan
#
# ============================================================

user www-data; # on ubuntu it runs as www-data
worker_processes auto; # default: 1; 1 worker per 1 core
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 512;
}

http {
    server_tokens off; # Hide nginx version number for security

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Aggressive Rate Limiting
    limit_req_zone $binary_remote_addr zone=contact:5m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=gallery:5m rate=4r/s;
    limit_conn_zone $binary_remote_addr zone=conn:5m;
    limit_req_status 429; # default 503; respond Too Many Requests
    limit_conn_status 429; # default 503; respond Too Many Requests

    # Aggressive Timeout Settings -> per-request resources (client <-> nginx)
    client_max_body_size 4k; # default is 1M uncompressed; 4kb maximum allowed size of client request body -> there would be only text in contact form, so it is enough
    client_header_timeout 10s;   # default: 60s; max time to receive the full request headers; kills header-drip Slowloris
    client_body_timeout   10s;   # default: 60s; max time *between reads* of the body; kills slow-body attacks
    send_timeout          10s;   # default: 60s; max time *between writes* while sending the response to a slow reader
    keepalive_timeout  60 60; # default: 75s; how long to keep idle connections open for potential reuse (reduce latency for subsequent requests), second 
        
    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;

    map $http_origin $cors_origin {
        default                      "";
        "https://momentkaph.sk"      "https://momentkaph.sk";
        "https://www.momentkaph.sk"  "https://www.momentkaph.sk";
    }
    
    map $http_user_agent $bad_ua {
        default 0;
        "~*(?:nikto|sqlmap|nmap|masscan|zgrab|nuclei|wpscan|dirbuster|gobuster|feroxbuster|httrack|wpscan|xmlrpc|acunetix|netsparker)" 1;
        ""    1;
    }

    log_format edge escape=json
    '$time_iso8601 $remote_addr '
    '| $scheme/$server_protocol tls=$ssl_protocol sni=$ssl_server_name '
    '| HOST: "$host" (vhost=$server_name) '
    '| REQ: "$request" len=$request_length '
    '| RES: status=$status sent=$bytes_sent done=$request_completion '
    '| TIME: total=$request_time upstream=$upstream_response_time '
    '| UP: $upstream_addr status="$upstream_status" '
    '| CACHE: $upstream_cache_status '
    '| UA: "$http_user_agent" REF: "$http_referer" XFF: "$http_x_forwarded_for" '
    '| id=$request_id conn=$connection/$connection_requests';

    access_log /var/log/nginx/access.log edge;

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=mobile_image_cache:10m max_size=64m inactive=60d use_temp_path=off;

    gzip on;
    gzip_min_length 256; # responses smaller than 256 bytes left uncompressed, it would be contra-productive
    gzip_comp_level 5; # default: 1; balance between compression ratio and CPU usage
    gzip_types
        application/json; # responses in my case are always json

    include /etc/nginx/conf.d/*.conf;
}