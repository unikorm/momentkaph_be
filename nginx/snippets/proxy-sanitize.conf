# ============================================================
# UPSTREAM RESPONSE SANITIZATION
# ============================================================
# Included in every location that does proxy_pass.
#
# Two jobs:
#   1. stop the backend fingerprinting itself
#   2. make nginx the single source of truth for security and
#      CORS headers, so the client never sees a duplicate or a
#      conflicting pair
#
# proxy_hide_header silently ignores headers that aren't in the
# response, so over-listing is free. Under-listing is the leak.
#
# When you add a new npm middleware, curl the endpoint directly
# against 127.0.0.1:4869 and diff the headers against this file.
# ============================================================

# --- Technology fingerprinting ---
proxy_hide_header X-Powered-By;         # Express sets this by default.
                                        # Also do app.disable('x-powered-by')
                                        # in Node — defence in depth.
proxy_hide_header Server;
proxy_hide_header X-AspNet-Version;
proxy_hide_header X-Runtime;

# --- Security headers: nginx is authoritative ---
# Without these, a helmet.js upgrade in Node would start emitting
# a second, different HSTS/CSP alongside ours. Browsers resolve
# duplicate CSP by intersecting them, which silently tightens or
# breaks things in ways that are miserable to debug.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Content-Security-Policy;
proxy_hide_header Content-Security-Policy-Report-Only;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header Cross-Origin-Resource-Policy;
proxy_hide_header Cross-Origin-Embedder-Policy;
proxy_hide_header X-XSS-Protection;     # deprecated and actively harmful (manual §12)

# --- CORS: nginx is authoritative ---
# Two Access-Control-Allow-Origin headers is not "more permissive",
# it is a hard CORS failure in every browser. If the `cors` npm
# package is ever enabled in Node, this is what saves you.
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Methods;
proxy_hide_header Access-Control-Allow-Headers;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Access-Control-Expose-Headers;
proxy_hide_header Access-Control-Max-Age;

# --- Caching: nginx is authoritative ---
# Note the division of labour:
#   proxy_ignore_headers Cache-Control -> what NGINX stores
#   proxy_hide_header    Cache-Control -> what the CLIENT sees
# You had the first one. Without the second, the client gets both
# Node's directive and ours, and picks whichever it feels like.
proxy_hide_header Cache-Control;
proxy_hide_header Expires;
proxy_hide_header Pragma;

# --- Internal topology / tracing ---
# X-Request-ID goes INTO the backend for correlation (see
# proxy_set_header in the server block) but must not come back
# out — it is an internal debugging handle, not client data.
proxy_hide_header X-Request-ID;
proxy_hide_header X-Correlation-ID;
proxy_hide_header X-Trace-ID;
proxy_hide_header X-Real-IP;
proxy_hide_header X-Forwarded-For;
proxy_hide_header X-Forwarded-Proto;
proxy_hide_header X-Forwarded-Host;
proxy_hide_header Via;

# --- Cloud storage passthrough leaks ---
# The gallery endpoint returns links to object storage. If the Node
# process ever proxies rather than links, these ride along.
proxy_hide_header x-amz-request-id;
proxy_hide_header x-amz-id-2;
proxy_hide_header x-ms-request-id;
proxy_hide_header x-goog-generation;
proxy_hide_header x-guploader-uploadid;