# ============================================================
# AUTHORITATIVE RESPONSE HEADERS
# ============================================================
# Including this file in every location makes the headers
# local, so nothing can knock them out.
#
# Cache-Control deliberately lives OUTSIDE this file. It is
# per-endpoint policy, not a global constant: your old config
# stamped "public, max-age=86400" on contact-form responses too.
# ============================================================

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; sandbox" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-site" always;
add_header Access-Control-Allow-Origin  $cors_origin always;
add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
add_header Access-Control-Allow-Headers "Content-Type" always;  # Authorization goes here when added
add_header Access-Control-Max-Age       "3600" always;
add_header Vary "Origin" always;