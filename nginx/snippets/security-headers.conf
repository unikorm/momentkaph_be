# ============================================================
# AUTHORITATIVE RESPONSE HEADERS
# ============================================================
# Included at server level AND inside every location block.
#
# WHY BOTH — this is the single most important structural fix
# in this whole rewrite:
#
#   add_header is NOT additive across levels. A location block
#   inherits the parent's add_header directives ONLY IF it
#   declares none of its own. The moment you add ONE add_header
#   inside a location, EVERY server-level header silently
#   disappears from that location's responses.
#
#   Including this file in every location makes the headers
#   local, so nothing can knock them out.
#
# Cache-Control deliberately lives OUTSIDE this file. It is
# per-endpoint policy, not a global constant: your old config
# stamped "public, max-age=86400" on contact-form responses too.
# ============================================================

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# --- Content handling ---
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;

# CSP for a pure-JSON API: allow nothing at all. If a response ever
# gets rendered as a document (error page, MIME confusion), it has
# no scripting capability whatsoever.
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; sandbox" always;

# --- Privacy / capability ---
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;

# --- Cross-origin isolation ---
add_header Cross-Origin-Opener-Policy "same-origin" always;
#
# CORP: `same-site`, NOT `same-origin`.
# momentkaph.sk and api.momentkaph.sk are the same *site* but
# different *origins*. Copying `same-origin` over from the IPL
# gateway config (where nginx and the app share one hostname)
# would make the browser refuse every response your own frontend
# fetches. This is the exact trap in reusing that snippet.
add_header Cross-Origin-Resource-Policy "same-site" always;

# --- CORS ---
# $cors_origin comes from the map in nginx.conf. Empty for any
# non-allow-listed origin, and nginx omits add_header on an empty
# value — so unknown origins get no CORS header at all.
add_header Access-Control-Allow-Origin  $cors_origin always;
add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
add_header Access-Control-Allow-Headers "Content-Type" always;  # Authorization goes here when added
add_header Access-Control-Max-Age       "3600" always;
add_header Vary "Origin" always;